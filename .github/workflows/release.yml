name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.0.0-alpha.2)"
        required: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libusb (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libusb-1.0-0-dev:arm64
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y libusb-1.0-0-dev
          fi

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV

      - name: Build binaries
        working-directory: rust
        run: |
          cargo build --release --target ${{ matrix.target }} -p biospy-cli
          cargo build --release --target ${{ matrix.target }} -p biospy-mcp

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "${TAG}" ] || [ "${TAG}" = "${GITHUB_REF_NAME}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TAG="${TAG#v}"
          fi
          NAME="biospy-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp rust/target/${{ matrix.target }}/release/biospy "dist/$NAME/"
          cp rust/target/${{ matrix.target }}/release/biospy-mcp "dist/$NAME/"
          cp README.md "dist/$NAME/" || true
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          ls -la dist/

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v',''
          if (-not $tag -or $tag -eq $env:GITHUB_REF_NAME) {
            $tag = $env:INPUT_TAG -replace '^v',''
          }
          $name = "biospy-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item rust\target\${{ matrix.target }}\release\biospy.exe "dist/$name/"
          Copy-Item rust\target\${{ matrix.target }}\release\biospy-mcp.exe "dist/$name/"
          Copy-Item README.md "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: biospy-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
