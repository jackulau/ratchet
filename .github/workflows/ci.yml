name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight; pushes to main
# always run to completion so every commit on main has a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bindgen (ratchet-usb-sys) needs system libusb headers via pkg-config
      # plus libclang to parse them.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config clang

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Strict doc build
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config clang

      # libclang ships with the Xcode command line tools on the runner.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tests (all features)
        working-directory: rust
        run: cargo test --workspace --all-features --locked

      - name: Release build
        working-directory: rust
        run: cargo build --workspace --release --locked

      - name: CLI smoke (forced mock)
        env:
          RATCHET_FORCE_MOCK: "1"
        run: bash tasks/cli-smoke.sh

      - name: MCP smoke (forced mock)
        env:
          RATCHET_FORCE_MOCK: "1"
        run: bash tasks/mcp-smoke.sh

  # Proves the `rust-version` declared in rust/Cargo.toml is real: the
  # workspace must build on the oldest toolchain the README promises.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config clang

      - name: Install the declared minimum Rust version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)"
          test -n "$msrv"
          echo "MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check on the minimum Rust version
        working-directory: rust
        run: cargo check --workspace --all-features --locked
