name: Rust CI

on:
  push:
    branches: [main, master]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock', 'rust/**/Cargo.toml') }}

      # ─── Linux: libusb-1.0 dev headers ────────────────────────────────────
      - name: Install libusb-1.0 (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      # ─── macOS: libusb via Homebrew ───────────────────────────────────────
      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      # ─── Windows: libusb via vcpkg ────────────────────────────────────────
      # NOTE: Windows libusb support is best-effort in CI. End-user install
      # uses the WinUSB driver (Zadig) rather than libusb directly; see D25
      # distribution docs. CI build uses vcpkg-bundled libusb.
      - name: Install libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "LIBUSB_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> $env:GITHUB_ENV
          echo "LIBUSB_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" >> $env:GITHUB_ENV

      - name: Build workspace
        working-directory: rust
        run: cargo build --workspace

      - name: Run tests
        working-directory: rust
        env:
          BIOSPY_FORCE_MOCK: "1"
        run: cargo test --workspace

      - name: Build CLI release
        working-directory: rust
        run: cargo build --release -p biospy-cli

      - name: Build MCP server release
        working-directory: rust
        run: cargo build --release -p biospy-mcp

      - name: Smoke test — --self-test
        working-directory: rust
        env:
          BIOSPY_FORCE_MOCK: "1"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./target/release/biospy-cli.exe --self-test
          else
            ./target/release/biospy-cli --self-test
          fi

      - name: Smoke test — MCP tools/list (unix only)
        if: runner.os != 'Windows'
        working-directory: rust
        env:
          BIOSPY_FORCE_MOCK: "1"
        shell: bash
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ./target/release/biospy-mcp)
          echo "$out" | grep -q '"name":"detect"' || (echo "missing detect tool"; exit 1)
          echo "$out" | grep -q '"name":"identify"' || (echo "missing identify tool"; exit 1)

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: rustfmt
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
