[workspace]
resolver = "2"
members = [
    "ratchet-usb-sys",
    "ratchet-usb",
    "ratchet-core",
    "ratchet-cli",
    "ratchet-mcp",
    "ratchet-node",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["ratchet contributors"]
repository = "https://github.com/jackulau/ratchet"
description = "ratchet  -  multi-protocol hardware debug + programming toolkit (CH341A / CH347 USB programmers, SPI / I2C / UART / 1-Wire / JTAG / SWD / CAN, AVR / STM32 / ESP programmers). Fully native Rust."

[workspace.dependencies]
ratchet-usb-sys = { path = "ratchet-usb-sys", version = "2.0.0-alpha.1" }
ratchet-usb     = { path = "ratchet-usb",     version = "2.0.0-alpha.1" }
ratchet-core    = { path = "ratchet-core",    version = "2.0.0-alpha.1" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
