[workspace]
resolver = "2"
members = [
    "biospy-usb-sys",
    "biospy-usb",
    "biospy-core",
    "biospy-cli",
    "biospy-mcp",
    "biospy-node",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["biospy contributors"]
repository = "https://github.com/jacklau/biosMCP"
description = "Modern BIOS chip programmer and debugger for CH341A / CH347 USB programmers — fully native Rust"

[workspace.dependencies]
biospy-usb-sys = { path = "biospy-usb-sys", version = "2.0.0-alpha.1" }
biospy-usb     = { path = "biospy-usb",     version = "2.0.0-alpha.1" }
biospy-core    = { path = "biospy-core",    version = "2.0.0-alpha.1" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
