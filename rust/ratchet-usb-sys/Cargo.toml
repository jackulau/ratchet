[package]
name = "ratchet-usb-sys"
description = "Raw FFI bindings to libusb-1.0, generated at build time by bindgen. Custom binding  -  no third-party USB crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
links = "usb-1.0"

[lib]
name = "ratchet_usb_sys"

[build-dependencies]
# 0.73 or newer: bindgen 0.71 emits `libusb_transfer` with no fields when it
# parses libusb.h with libclang 22, which the generated layout assertions catch.
bindgen = "0.73"
pkg-config = "0.3"
